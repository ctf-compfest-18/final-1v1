version: "3.9"

services:
  vault:
    build: .
    container_name: vault

    restart: unless-stopped

    ports:
      - "5100:5000"

    privileged: true

    read_only: true

    tmpfs:
      - /tmp:size=16M
      - /run:size=4M

    environment:
      JAIL_TIME: "60"
      JAIL_MEM: "64M"
      JAIL_PIDS: "16"
      JAIL_CPU: "100"

    mem_limit: 256m
    cpus: 0.25