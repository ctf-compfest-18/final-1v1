{% extends "base.html" %}
{% block body %}
  <h2>Join the Ensemble</h2>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    <div class="row">
      <label>Choose Username: <input name="username" placeholder="E.g., Mozart, Bach..." /></label>
    </div>
    <div class="row">
      <label>Choose Passphrase: <input name="password" type="password" /></label>
    </div>
    <div class="row">
      <button type="submit">Register</button>
    </div>
  </form>
{% endblock %}
