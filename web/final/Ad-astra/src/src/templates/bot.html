{% extends "base.html" %}
{% block body %}
  <h2>The Conductor</h2>
  <p>Submit a URL. The conductor will login as admin, visit <code>/flag</code>, then attend to your URL.</p>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  {% if ok %}
    <p class="ok">Bot ran.</p>
  {% endif %}
  <form method="post">
    <div class="row">
      <input name="url" placeholder="http://127.0.0.1:5024/..." />
    </div>
    <div class="row">
      <button type="submit">Summon Conductor</button>
    </div>
  </form>
{% endblock %}
