{% extends "base.html" %}
{% block body %}
  <h2>Enter Stage</h2>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    <div class="row">
      <label>Maestro Username: <input name="username" /></label>
    </div>
    <div class="row">
      <label>Passphrase: <input name="password" type="password" /></label>
    </div>
    <div class="row">
      <button type="submit">Enter the Hall</button>
    </div>
  </form>
{% endblock %}
