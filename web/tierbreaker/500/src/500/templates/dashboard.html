<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RONGAWI - Dashboard</title>
    <style>
        *{box-sizing:border-box} body{font:16px Arial,sans-serif;background:#fff8d8;color:#17213b;margin:0}
        header{background:#f4c430;color:#17213b;padding:20px 9%;display:flex;justify-content:space-between;align-items:center}
        .brand{font-size:24px;font-weight:bold}.brand a{color:#17213b;text-decoration:none}.logout{color:#17213b;text-decoration:none;font-weight:bold}
        main{max-width:900px;margin:42px auto;padding:0 24px}.welcome{margin-bottom:28px}
        h1{font-size:36px;margin:0 0 8px}.muted{color:#65708a}.card{background:#fff;padding:25px;border-radius:14px;box-shadow:0 5px 22px #e4dcae}
        .card h2{margin-top:0}.course{border:1px solid #eadb91;border-left:6px solid #f4c430;padding:18px;border-radius:8px;margin-top:16px;background:#fffdf0}
        .course strong{font-size:19px}.course p{margin:8px 0 0;color:#65708a}
    </style>
</head>
<body>
    <header><div class="brand"><a href="/dashboard/">RONGAWI</a></div><a class="logout" href="/logout/">Keluar</a></header>
    <main>
        <section class="welcome"><h1>Dashboard</h1><div class="muted">Selamat datang, {{ username }}.</div></section>
        <section class="card">
            <h2>Cek Mata Kuliah</h2>
            {% for course in courses %}
            <div class="course">
                <strong>{{ course.code }} - {{ course.name }}</strong>
                <p>{{ course.credits }} SKS &nbsp; | &nbsp; {{ course.schedule }}</p>
                <p><a href="/course/{{ course.id }}/">Lihat detail mata kuliah</a></p>
            </div>
            {% endfor %}
        </section>
    </main>
</body>
</html>
