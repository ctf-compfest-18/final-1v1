services:
  chall:
    build: .
    environment:
      PORT: 3000
      FLAG: ${FLAG:-COMPFEST18{aurora_manifest_local_placeholder_not_for_submission}}
    ports:
      - "${PORT_MAP:-4009}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
