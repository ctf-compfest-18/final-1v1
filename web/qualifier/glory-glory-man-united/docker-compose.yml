# Konfigurasi dibaca dari .env (folder ini). Default mengacu ke nilai di bawah.
services:
  web:
    build: ./web
    environment:
      FLAG: ${FLAG:-COMPFEST18{plsss_wok_jangan_buat_minggu_gw_suram_lagi_gegara_nontonin_lu_kalah_mulu}}}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-9r90ur0qmr093mr0mc932mrcq2mrr2c30qru32}
      BOT_URL: http://bot:3000
      REPORT_COOLDOWN_SECONDS: ${REPORT_COOLDOWN_SECONDS:-60}
    ports:
      - "${WEB_PORT:-4010}:8000"
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      WEB_ORIGIN: http://web:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN in .env}
      BOT_WAIT_MS: ${BOT_WAIT_MS:-45000}
      BOT_GAP_MS: ${BOT_GAP_MS:-2000}
      BOT_MAX_QUEUE: ${BOT_MAX_QUEUE:-50}
    depends_on:
      - web
    restart: unless-stopped
