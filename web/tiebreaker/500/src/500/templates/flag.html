<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RONGAWI - Flag</title>
    <style>
        *{box-sizing:border-box} body{font:16px Arial,sans-serif;background:#fff8d8;color:#17213b;margin:0}
        header{background:#f4c430;color:#17213b;padding:20px 9%;font-size:24px;font-weight:bold}
        header a{color:#17213b;text-decoration:none}.wrap{max-width:760px;margin:42px auto;padding:0 24px}
        .card{background:#fff;padding:32px;border-radius:14px;box-shadow:0 5px 22px #e4dcae}
        h1{margin:0 0 10px;font-size:34px}.muted{color:#65708a;margin-bottom:24px}
        .flag{background:#fffdf0;border:1px solid #eadb91;border-left:6px solid #f4c430;padding:18px;border-radius:8px;word-break:break-all;font-family:monospace;font-size:16px}
        a.back{display:inline-block;margin-top:24px;color:#17213b;font-weight:bold}
    </style>
</head>
<body>
    <header><a href="/dashboard/">RONGAWI</a></header>
    <main class="wrap">
        <section class="card">
            <div class="flag">{{ flag }}</div>
        </section>
    </main>
</body>
</html>
