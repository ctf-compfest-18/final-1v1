<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RONGAWI - Login</title>
    <style>
        *{box-sizing:border-box} body{font:16px Arial,sans-serif;background:#fff8d8;color:#17213b;margin:0}
        header{background:#f4c430;color:#17213b;padding:22px 9%;font-size:24px;font-weight:bold}
        header a{color:#17213b;text-decoration:none}
        main{max-width:760px;margin:48px auto;background:#fff;padding:38px;border-radius:14px;box-shadow:0 5px 22px #e4dcae}
        h1{font-size:40px;margin:0 0 28px;color:#17213b} p{font-size:18px;line-height:1.5}
        form{margin-top:28px;max-width:360px} input,button{width:100%;padding:14px;margin:7px 0;border-radius:6px;font-size:16px}
        input{border:1px solid #c5c5c5} button{background:#17213b;color:#fff;border:0;font-weight:bold;cursor:pointer}
    </style>
</head>
<body>
    <header><a href="/dashboard/">RONGAWI</a></header>
    <main>
        <h1>Portal Akademik Mahasiswa</h1>
        <p>Login untuk mengakses dashboard akademik kamu.</p>
        <form method="post" action="/login/">
            <input name="username" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Masuk</button>
        </form>
    </main>
</body>
</html>
