plugins {
    id 'com.android.application'
}

android {
    namespace 'id.compfest.burhan'
    compileSdk 34

    defaultConfig {
        applicationId "id.compfest.burhan"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
