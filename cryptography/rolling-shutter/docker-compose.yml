services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rolling-shutter
    ports:
      # Participant URL: http://34.1.203.129:3000 (Crypto range: 3000-4000).
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
